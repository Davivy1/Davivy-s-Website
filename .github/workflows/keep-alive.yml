name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at midnight UTC to prevent Supabase Free Tier auto-pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab for testing

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Ping to Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"